<!doctype html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FusionBrain | Jarvis-Style Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight">
        <span class="text-cyan-400">Fusion</span>Brain
      </h1>
      <p class="text-slate-300 mt-2">Prototip cloud & free në stilin Jarvis (v0.1).</p>
    </header>

    <section class="grid md:grid-cols-3 gap-4 mb-6">
      <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
        <h2 class="font-semibold text-cyan-300 mb-2">👁️ Sy</h2>
        <p class="text-sm text-slate-300">Vision module planifikuar për v0.2 (kamera + zbulim objektesh).</p>
      </article>
      <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
        <h2 class="font-semibold text-cyan-300 mb-2">👂👄 Zëri</h2>
        <p class="text-sm text-slate-300">STT + TTS pipeline. TTS aktualisht placeholder.</p>
      </article>
      <article class="rounded-xl border border-slate-800 bg-slate-900 p-4">
        <h2 class="font-semibold text-cyan-300 mb-2">🖐️ Duar</h2>
        <p class="text-sm text-slate-300">Tool-calling për motin dhe web kërkim.</p>
      </article>
    </section>

    <section class="rounded-2xl border border-cyan-900/60 bg-slate-900/70 p-4 shadow-2xl">
      <div id="chat" class="h-80 overflow-y-auto space-y-3 p-2 rounded-lg bg-slate-950 border border-slate-800 mb-4"></div>
      <form id="chatForm" class="flex gap-2">
        <input id="message" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2" placeholder="Shkruaj komanden... p.sh. Si eshte moti ne Tirane?" required />
        <button class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold px-4 py-2 rounded-lg">Dergo</button>
      </form>
      <p class="text-xs text-slate-400 mt-3">API default: <code>http://127.0.0.1:8000/chat</code></p>
    </section>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('message');

    const addBubble = (role, text) => {
      const row = document.createElement('div');
      row.className = role === 'user' ? 'text-right' : 'text-left';

      const bubble = document.createElement('div');
      bubble.className = role === 'user'
        ? 'inline-block bg-cyan-500 text-slate-900 rounded-xl px-3 py-2 max-w-[80%]'
        : 'inline-block bg-slate-800 text-slate-100 rounded-xl px-3 py-2 max-w-[80%]';
      bubble.textContent = text;
      row.appendChild(bubble);

      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addBubble('user', message);
      input.value = '';

      try {
        const res = await fetch('http://127.0.0.1:8000/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: 'fusion-user', message, use_memory: true })
        });

        if (!res.ok) {
          const err = await res.text();
          addBubble('assistant', `Gabim API: ${err}`);
          return;
        }

        const data = await res.json();
        addBubble('assistant', data.reply || 'Nuk mora pergjigje.');
      } catch (err) {
        addBubble('assistant', 'Nuk u lidh me backend. Nise API me: uvicorn app.main:app --reload');
      }
    });

    addBubble('assistant', 'Pershendetje! Une jam FusionBrain v0.1. Jep nje komande.');
  </script>
</body>
</html>
